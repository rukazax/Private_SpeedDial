<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private SpeedDial</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --accent: #35c2b5; --accent-soft: rgba(53,194,181,.18); }
        body {
            width: 292px; padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI Variable', 'Segoe UI', Roboto, sans-serif;
            background: #0c1118; color: #e6ebf2; -webkit-font-smoothing: antialiased;
        }
        .header { text-align: left; margin-bottom: 14px; padding: 2px 2px 12px; border-bottom: 1px solid rgba(255,255,255,.1); }
        .header h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
        .header p { font-size: 12px; color: #98a3b3; margin-top: 4px; }
        .button {
            display: block; width: 100%; padding: 10px 12px; margin: 6px 0; border: 1px solid rgba(255,255,255,.1);
            border-radius: 12px; cursor: pointer; font-size: 13.5px; font-weight: 500; text-align: left;
            transition: transform .12s ease, filter .12s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
            background: #151c26; color: #e6ebf2; font-family: inherit;
        }
        .button:hover { background: #1b2430; border-color: rgba(255,255,255,.2); }
        .button:active { transform: scale(.97); filter: brightness(.92); }
        .button:focus-visible, .profile-select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .button.pressed { animation: btnPress .35s ease; }
        .button.loading { pointer-events: none; opacity: .75; }
        .button.loading::after { content: ''; display: inline-block; width: 12px; height: 12px; margin-left: 8px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; vertical-align: middle; animation: btnSpin .7s linear infinite; }
        .button.flash-success { animation: btnFlashSuccess .9s ease; }
        .button.flash-error { animation: btnFlashError .9s ease; }
        .button.shake { animation: btnShake .4s ease; }
        @keyframes btnPress { 0% { box-shadow: 0 0 0 0 transparent; } 40% { box-shadow: 0 0 0 6px var(--accent-soft); } 100% { box-shadow: 0 0 0 0 transparent; } }
        @keyframes btnSpin { to { transform: rotate(360deg); } }
        @keyframes btnFlashSuccess { 0%,100% { box-shadow: 0 0 0 0 transparent; } 40% { box-shadow: 0 0 0 8px rgba(76,175,80,.35); } }
        @keyframes btnFlashError { 0%,100% { box-shadow: 0 0 0 0 transparent; } 40% { box-shadow: 0 0 0 8px rgba(240,84,100,.35); } }
        @keyframes btnShake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
        .button-primary { background: var(--accent); color: #07201d; font-weight: 650; border-color: transparent; text-align: center; }
        .button-primary:hover { background: var(--accent); filter: brightness(1.08); }
        .button-secondary { background: transparent; }
        .status { margin-top: 10px; padding: 9px 10px; border-radius: 10px; text-align: center; font-size: 12px; display: none; }
        .status.success { background: rgba(70,196,122,.14); color: #46c47a; display: block; }
        .status.error { background: rgba(242,107,120,.14); color: #f26b78; display: block; }
        .status.info { background: var(--accent-soft); color: var(--accent); display: block; }
        .note { font-size: 11px; color: #6f7a8a; text-align: center; margin-top: 12px; line-height: 1.4; }
        .profile-select {
            width: 100%; padding: 9px 10px; margin: 6px 0; border: 1px solid rgba(255,255,255,.1); border-radius: 12px;
            background: #151c26; color: #e6ebf2; font-family: inherit; font-size: 13.5px;
        }
        @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
<link rel="stylesheet" href="project.css">
</head>
<body>
    <div class="header">
        <h2>Private SpeedDial</h2>
        <p data-i18n="popupTagline">Приватный быстрый доступ к закладкам</p>
    </div>

    <button type="button" class="button button-primary" id="openSpeedDial" data-i18n="popupOpen">🚀 Открыть Private SpeedDial</button>
    <button type="button" class="button" id="syncButton" data-i18n="popupSync">🔄 Синхронизировать (объединить)</button>
    <button type="button" class="button" id="lockButton" data-i18n="popupLock">🔒 Заблокировать</button>

    <select id="profileSelect" class="profile-select">
        <option value="" data-i18n="popupProfile">Профиль</option>
    </select>

    <button type="button" class="button button-secondary" id="settingsButton" data-i18n="popupSettings">⚙️ Настройки</button>

    <div id="status" class="status"></div>

    <div class="note"><span data-i18n="popupHint1">Для открытия при новой вкладке используйте</span><br><span data-i18n="popupHint2">кнопку «Открыть Private SpeedDial»</span></div>

    <script src="translations.js"></script>
    <script src="project-i18n.js"></script>
    <script src="common.js"></script>
    <script src="dialog.js"></script>
    <script src="popup.js"></script>
<script src="project.js"></script>
    <script src="project-ui.js"></script>
</body>
</html>
